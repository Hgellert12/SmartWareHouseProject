services:
  db:
    image: postgres:18
    container_name: smartwarehouse-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: smartwarehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: