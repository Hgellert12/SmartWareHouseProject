
# Application
spring.application.name=SmartWareHouseProject

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/smartwarehouse
spring.datasource.username=smartwarehouse_app
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true